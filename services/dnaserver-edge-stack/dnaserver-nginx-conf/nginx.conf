server {
    listen 80;
    server_name grafana.dnaserver.com;

    location / {
        proxy_pass http://10.0.0.70;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name alertmanager.dna-server.com;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-alertmanager;
    location / {
        proxy_pass http://10.0.0.70;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name files.dna-server.com;
    
    ssl_certificate /etc/letsencrypt/live/dna-server.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dna-server.com/privkey.pem;

    location / {
        proxy_pass http://10.0.0.70;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


